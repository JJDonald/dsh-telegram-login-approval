# 把本插件挂到 DSH 的 web profile。
#
# 用法：
#   1. 复制本文件为 cordis.yml（或任意名字）
#   2. 把 <PLUGIN_DIR> 替换为本插件在本机的绝对路径
#      例：Linux/macOS  /home/you/dsh-telegram-login-approval
#          Windows      F:/path/to/dsh-telegram-login-approval
#   3. 设置 Bot Token 环境变量（见 README「安装」）
#
# 注意：Cordis 的 patch overlay 要求 name 是**绝对路径**，
# 且 Windows 上必须写成 `F:/...` 而不是 `/f/...`（后者会被解析成 `F:/f/...`）。

- insert:
    - id: telegram-login-approval
      name: '<PLUGIN_DIR>/src/index.ts'
      config:
        # 总开关；false 时完全不包装，等价于未安装。
        enabled: true

        # Bot Token 的环境变量名（推荐）。程序启动时从环境读取，配置里不出现明文。
        botTokenRef: TELEGRAM_LOGIN_BOT_TOKEN

        # 唯一被接受的 Telegram 数字用户 ID（用 @userinfobot 查询）。
        # 下面的值是占位示例，务必改成你自己的。
        adminChatId: 123456789

        # 本部署唯一的公开 HTTPS origin（必填）。登录页与确认卡片都以此为信任边界，
        # 也是 `/key` 提示与 Host 校验的基准。不要带结尾斜杠、不要带路径。
        publicOrigin: 'https://dsh.example.com'

        # Bot 用户名（不含 @）。可选：仅用于登录页提示文案与 `/key@<bot>` 群组指令匹配。
        # 留空时页面自动降级为通用文案（不硬编码任何某一部署的 Bot）。
        botUsername: 'example_bot'

        # 持久 Secret Key 文件的绝对路径（必填）。必须存在且为 root-only 普通文件
        # （owner=root，权限 600）；插件启动时会强制校验，不满足直接抛错。
        # 生成：install -m 600 /dev/null /etc/dsh/web-secret.key
        #       head -c 32 /dev/urandom | base64 | tr -d '\n' > /etc/dsh/web-secret.key
        secretFile: '/etc/dsh/web-secret.key'

        # 登录批准请求的有效期（秒）。当前固定为 300（只支持 300）。
        ttlSeconds: 300

        # 触发限流：窗口秒数 / 窗口内最多触发次数 / 超限后的冷却秒数。
        windowSeconds: 600
        maxTriggersPerWindow: 3
        cooldownSeconds: 600

        # 被拒绝时是否回发提示。
        notifyOnDeny: true

        # 演习模式：true 时不发起任何 Telegram 网络请求，仅本地验证门禁行为。
        dryRun: false
